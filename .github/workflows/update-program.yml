name: Update Church Bulletin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * SUN"   # Sundays at 12:00 UTC (adjust as needed)

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install gdown

      - name: Download latest bulletin
        run: |
          # Write the service account key to a file
          echo "${{ secrets.GDRIVE_SERVICE_ACCOUNT }}" > service_account.json

          # Set the environment variable so gdown uses it
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service_account.json

          # Download the PDF
          gdown --id ${{ secrets.GDRIVE_FILE_ID }} --output bulletin.pdf

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No changes."
          else
            git add bulletin.pdf
            git commit -m "Update bulletin"
            git push
          fi
